<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up · Theater Dramus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <div class="card">
            <a href="/" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
                Back to Home
            </a>

            <h2>Create Your Account</h2>

            <form action="/signup" method="POST">
                <label for="n">Name</label>
                <input id="n" name="name" type="text" required autocomplete="name">

                <label for="e">Email</label>
                <input id="e" name="email" type="email" required autocomplete="email" placeholder="user@gmail.com">

                <label for="p">Password (6+ characters)</label>
                <input id="p" name="pw" type="password" required minlength="6" autocomplete="new-password">

                <p>
                    <button class="btn" type="submit">Sign Up</button>
                </p>

                {% if msg %}
                    <div id="msg" class="msg {{ msg_type }}" role="alert" style="display: block;">
                        {{ msg }}
                    </div>
                {% endif %}
            </form>

            <p>
                Already have an account?
                <a href="/login">Log In</a>
            </p>
        </div>
    </main>
</body>
</html>
