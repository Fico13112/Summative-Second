<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BCA Checkout · Theater Dramus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white rounded-3xl p-6 shadow-xl border border-gray-100 space-y-6">
        <h2 class="text-xl font-extrabold text-gray-900 border-b pb-3">Payment Summary</h2>

        <div class="space-y-2 text-sm text-gray-700">
            <div class="flex justify-between"><span>Show:</span><strong class="text-gray-900">{{ show.t }}</strong></div>
            <div class="flex justify-between"><span>Venue:</span><span>Chapel SDH Lippo Cikarang</span></div>
            <div class="flex justify-between"><span>Time:</span><span>Today, 19:30</span></div>
            <div class="flex justify-between border-t pt-2 text-base font-bold">
                <span>Total Payment:</span>
                <span class="text-teal-700">Rp{{ "{:,}".format(show.price) }}</span>
            </div>
        </div>

        <div class="bg-teal-50 border border-teal-200 rounded-2xl p-4 text-xs space-y-1">
            <span class="font-bold text-teal-900 block">Bank Transfer (BCA Only):</span>
            <p class="font-mono text-sm font-bold text-gray-800">8300123456</p>
            <p class="text-gray-600">Account Holder: SDH Dramus Committee</p>
        </div>

        <form action="/checkout/{{ show_id }}" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Upload Payment Screenshot</label>
                <input type="file" name="proof" accept="image/*" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 border rounded-xl p-1">
            </div>
            {% if error %}
                <p class="text-xs text-red-600 font-bold">{{ error }}</p>
            {% endif %}
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-extrabold py-3 rounded-2xl shadow-md transition">
                Confirm Order & Submit Proof
            </button>
        </form>
    </div>
</body>
</html>
